name: Refresh market and publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4,8 * * *'
permissions:
  contents: read
concurrency:
  group: market-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify calculations
        run: python3 -m unittest discover -s tests -v
      - name: Verify browser storage privacy
        run: node tests/test_online.js
      - name: Refresh public market data
        run: python3 generate.py
      - name: Retain public prediction ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/forecasts.json
          git add public/data/public-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public market observations [skip ci]'
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
